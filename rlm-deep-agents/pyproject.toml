[project]
name = "rlm-deep-agents"
version = "0.1.0"
description = "Exploring Recursive Language Models (RLMs) and dynamic subagents in LangChain Deep Agents via the code interpreter middleware."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents[quickjs]>=0.2.0",
    "langchain-quickjs>=0.2.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
# Install the provider SDK that matches the model you point RLM_MODEL at.
anthropic = ["langchain-anthropic>=0.3"]
openai = ["langchain-openai>=0.2"]
google = ["langchain-google-genai>=2"]

[project.scripts]
rlm-quickstart = "rlm_deep_agents.examples.quickstart_fanout:main"
rlm-classify = "rlm_deep_agents.examples.classify_and_act:main"
rlm-fanout = "rlm_deep_agents.examples.fanout_and_synthesize:main"
rlm-verify = "rlm_deep_agents.examples.adversarial_verification:main"
rlm-generate = "rlm_deep_agents.examples.generate_and_filter:main"
rlm-tournament = "rlm_deep_agents.examples.tournament:main"
rlm-loop = "rlm_deep_agents.examples.loop_until_done:main"
rlm-longcontext = "rlm_deep_agents.examples.rlm_long_context:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm_deep_agents"]
